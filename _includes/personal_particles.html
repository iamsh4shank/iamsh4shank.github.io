<!-- Personal Lifestyle Floating Animation -->
{% if page.permalink contains '/personal' or page.url contains '/personal' %}
<div class="lifestyle-particles-container" aria-hidden="true">
  <span class="lifestyle-particle" style="--x: 8%; --delay: 0.05s; --dur: 2.3s; --rotate: -15deg; --size: 1.9rem;">🥾</span>
  <span class="lifestyle-particle" style="--x: 20%; --delay: 0.25s; --dur: 2.6s; --rotate: 20deg; --size: 2.1rem;">🏍️</span>
  <span class="lifestyle-particle" style="--x: 34%; --delay: 0.1s; --dur: 2.2s; --rotate: -12deg; --size: 1.8rem;">📸</span>
  <span class="lifestyle-particle" style="--x: 48%; --delay: 0.35s; --dur: 2.7s; --rotate: 15deg; --size: 2.3rem;">🏔️</span>
  <span class="lifestyle-particle" style="--x: 62%; --delay: 0.15s; --dur: 2.4s; --rotate: -22deg; --size: 1.9rem;">⚽</span>
  <span class="lifestyle-particle" style="--x: 75%; --delay: 0.3s; --dur: 2.5s; --rotate: 12deg; --size: 2.0rem;">🎧</span>
  <span class="lifestyle-particle" style="--x: 88%; --delay: 0.2s; --dur: 2.3s; --rotate: 28deg; --size: 1.8rem;">🏕️</span>
  <span class="lifestyle-particle" style="--x: 14%; --delay: 0.5s; --dur: 2.4s; --rotate: -18deg; --size: 1.7rem;">☕</span>
  <span class="lifestyle-particle" style="--x: 40%; --delay: 0.45s; --dur: 2.6s; --rotate: 25deg; --size: 2.1rem;">🌲</span>
  <span class="lifestyle-particle" style="--x: 68%; --delay: 0.55s; --dur: 2.3s; --rotate: -15deg; --size: 1.8rem;">✈️</span>
  <span class="lifestyle-particle" style="--x: 82%; --delay: 0.4s; --dur: 2.5s; --rotate: 16deg; --size: 1.9rem;">🏸</span>
</div>
{% endif %}
